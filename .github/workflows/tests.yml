# Unit test pada tiap push/PR (audit fix: test ada tapi tak pernah dijalankan CI).
name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install duckdb pandas numpy pyarrow python-dotenv requests pytest
      - run: python -m pytest tests/ -q
