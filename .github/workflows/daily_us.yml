# Otomatisasi harian US — GRATIS via GitHub Actions.
# Strategi $0 tanpa storage eksternal: runner ephemeral menarik harga segar tiap run,
# skor pakai vonis backtest STATIS (config/validation.json), lalu COMMIT BALIK snapshot
# (snapshots/latest.json) ke repo sebagai rekam jejak harian + sumber dashboard hosted.
# Catatan: backtest 5 th dijalankan terpisah/lokal (sesekali), bukan tiap hari.
name: daily-us

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 21:00 UTC ~ 04:00 WIB (setelah US close)
  workflow_dispatch: {}

permissions:
  contents: write            # untuk commit snapshot balik

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (inti, tanpa torch/FinBERT)
        run: pip install duckdb pandas numpy yfinance pyarrow requests python-dotenv

      - name: Tarik harga + skor (engine harga tervalidasi) + export snapshot
        run: |
          python -c "from jobs.daily_us import run; run(period='2y', with_fundamentals=False)"
          python -m jobs.export_snapshot

      - name: Commit snapshot harian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json
          git commit -m "data: snapshot screener harian [skip ci]" || echo "tak ada perubahan"
          git push || echo "push dilewati"
