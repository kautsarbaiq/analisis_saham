# Otomatisasi harian US — GRATIS via GitHub Actions.
# Strategi $0: runner ephemeral menarik harga segar tiap run, skor pakai vonis
# backtest STATIS (config/validation.json), lalu COMMIT BALIK snapshot
# (snapshots/latest.json) ke repo sebagai rekam jejak harian + sumber dashboard hosted.
# DB DuckDB di-cache antar-run (actions/cache, tetap $0) agar histori short-volume
# FINRA tidak diunduh ulang 5 tahun tiap hari — cukup inkremental hari yang kurang.
# Audit fix: dulu shortvol TIDAK pernah di-ingest di CI -> sinyal berbobot terbesar
# kosong di snapshot publik; kini di-ingest (dan bila tetap gagal, engine
# mengembalikan None sehingga composite jujur memakai engine yang tersisa).
# Catatan: backtest 5 th dijalankan terpisah/lokal (sesekali), bukan tiap hari.
name: daily-us

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 21:00 UTC ~ 04:00 WIB (setelah US close)
  workflow_dispatch: {}

permissions:
  contents: write            # untuk commit snapshot balik

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50      # run perdana ingest FINRA 5 th (~20 mnt); selanjutnya cepat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (inti, tanpa torch/FinBERT)
        # feedparser+vaderSentiment utk digest berita; FinBERT (torch) SENGAJA
        # tidak dipasang di CI (berat) -> sentimen otomatis fallback ke VADER.
        run: pip install duckdb pandas numpy yfinance pyarrow requests python-dotenv feedparser vaderSentiment

      - name: Restore cache DB (histori short-volume FINRA)
        uses: actions/cache/restore@v4
        with:
          path: data/bandar.duckdb
          key: bandar-db-${{ github.run_id }}
          restore-keys: bandar-db-

      - name: Ingest short volume FINRA (inkremental — hanya bulan yang kurang)
        continue-on-error: true   # rate-limit CDN? snapshot tetap jujur (engine -> None)
        run: python -m jobs.shortvol_ingest

      - name: Tarik harga + skor (vonis per-market dari config/validation.json) + snapshot
        run: |
          python -c "from jobs.daily_us import run; run(period='2y', with_fundamentals=False)"
          python -m jobs.export_snapshot

      - name: Save cache DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bandar.duckdb
          key: bandar-db-${{ github.run_id }}

      # Screener di runner yang SAMA (audit fix: dulu workflow terpisah tanpa DB
      # -> gagal 100%). Tanpa secrets Telegram, hanya tercetak di log.
      - name: Digest berita portofolio (arsipkan headline + snapshot)
        continue-on-error: true   # RSS eksternal; kegagalannya tak boleh menggugurkan run
        run: python -m jobs.news_digest

      - name: Screener Top-N (cetak / Telegram bila secrets di-set)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobs.screener

      - name: Commit snapshot harian
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json snapshots/news_digest.json
          git commit -m "data: snapshot screener + digest berita harian [skip ci]" || echo "tak ada perubahan"
          git push || echo "push dilewati"
